services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_HOST: base
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: clave123
      DB_NAME: postgres
    depends_on:
      base:
        condition: service_healthy

  base:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: clave123
    volumes:
      - datos_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  broker:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"

volumes:
  datos_pg: